# CI/CD：push main 后自动部署后端
# 前端由 Vercel 连接 Git 仓库后自动构建，无需在此触发
#
# GitHub Secrets：
#   SSH_PRIVATE_KEY   登录服务器的私钥（整段 PEM）
#   SSH_USER          如 root / deploy
#   SERVER_REPO_PATH  服务器上 git 仓库根目录绝对路径
#
# 可选 Variables：
#   SSH_HOST          默认 biz.zood.work
#   GIT_BRANCH        默认 main
#   SYSTEMD_SERVICE   默认 figma-make-server

name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "完整代码/figma-make/server/**"
      - "完整代码/figma-make/scripts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-server:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH deploy server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.SSH_HOST || 'biz.zood.work' }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT || '22' }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.SERVER_REPO_PATH }}"
            export REPO_ROOT="${{ secrets.SERVER_REPO_PATH }}"
            export GIT_BRANCH="${{ vars.GIT_BRANCH || 'main' }}"
            export SYSTEMD_SERVICE="${{ vars.SYSTEMD_SERVICE || 'figma-make-server' }}"
            bash -l "./完整代码/figma-make/scripts/deploy-server.sh"
